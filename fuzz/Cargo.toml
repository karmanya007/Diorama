[package]
name = "diorama-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
diorama-core = { path = "../crates/diorama-core" }
diorama-we = { path = "../crates/diorama-we" }

# Kept out of the main workspace: needs nightly + libFuzzer.
[workspace]

[[bin]]
name = "pkg"
path = "fuzz_targets/pkg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tex"
path = "fuzz_targets/tex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mdl"
path = "fuzz_targets/mdl.rs"
test = false
doc = false
bench = false
