[package]
name = "diorama-media"
description = "Video decoding, sound playback and capture behind OS-neutral types."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
cpal.workspace = true
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# PulseAudio's protocol (pure Rust), which PipeWire serves too; ALSA otherwise.
cpal = { workspace = true, features = ["pulseaudio"] }
# The system's GStreamer (LGPL, linked dynamically) with its installed plugins.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
