[package]
name = "diorama-project"
description = "Diorama's own wallpaper format: reads a document and its assets and compiles them to the scene IR (ADR-009)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diorama-core.workspace = true
diorama-scene.workspace = true
diorama-text.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned: later 9.x releases come every few days (8.x has advisories about
# extracting, which is done by hand here). flate2 brings a pure Rust inflate.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[dev-dependencies]
diorama-gpu.workspace = true
diorama-render.workspace = true

[lints]
workspace = true
