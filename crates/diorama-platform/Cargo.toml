[package]
name = "diorama-platform"
description = "OS integration: outputs (monitors), wallpaper surfaces behind desktop icons, desktop events."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
# `client_system`: libwayland-client's display pointer, which Vulkan's
# Wayland surfaces need.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "process"] }
# logind lock events (blocking API on its own thread).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
