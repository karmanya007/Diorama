<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03101a; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Aurora: an example wallpaper made for Diorama (MIT OR Apache-2.0).
// Northern lights ripple over paper-cut snowy peaks and a still lake; the
// lights swell with music. `?t=<seconds>` draws one still frame,
// `&loop=<s>` makes every motion repeat after that many seconds.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const params = new URLSearchParams(location.search);
const still = params.has('t') ? parseFloat(params.get('t')) : null;
const LOOP = parseFloat(params.get('loop')) || 30;
const TAU = Math.PI * 2;

const settings = { tint: [0.2, 0.95, 0.65], second: [0.55, 0.35, 0.95], speed: 1 };
let level = 0;
let scene = null;

function random(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const css = (c, a = 1) => `rgba(${c.map((v) => Math.round(Math.min(1, Math.max(0, v)) * 255)).join(',')},${a})`;
const layer = (w, h) => {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
};

function build() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(innerWidth * dpr);
  const h = Math.round(innerHeight * dpr);
  canvas.width = w;
  canvas.height = h;
  const rnd = random(5);
  const horizon = h * 0.68;
  const s = { w, h, horizon, sky: layer(w, h), peaks: layer(w, h), stars: [], curtains: [] };

  const g = s.sky.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, horizon);
  grad.addColorStop(0, '#020812');
  grad.addColorStop(1, css(mix([0.03, 0.09, 0.14], settings.tint, 0.08)));
  g.fillStyle = grad;
  g.fillRect(0, 0, w, horizon);
  for (let i = 0; i < 220; i++) {
    s.stars.push({ x: rnd() * w, y: rnd() * horizon * 0.95, r: (0.4 + rnd()) * (h / 1080) * 1.2, k: 1 + Math.floor(rnd() * 3), p: rnd() * TAU });
  }

  // Each curtain: a ribbon of vertical light strips.
  for (let i = 0; i < 3; i++) {
    s.curtains.push({
      base: horizon * (0.32 + i * 0.12), height: h * (0.16 + rnd() * 0.12),
      waves: [1, 2, 3].map((k) => ({ k: k + i, p: rnd() * TAU, a: (0.5 + rnd() * 0.5) / k, m: 1 + Math.floor(rnd() * 2) })),
      colour: i === 1 ? settings.second : settings.tint, alpha: 0.42 - i * 0.07,
    });
  }
  s.strip = layer(1, 256);
  const sg = s.strip.getContext('2d');
  const sgrad = sg.createLinearGradient(0, 0, 0, 256);
  sgrad.addColorStop(0, 'rgba(255,255,255,0)');
  sgrad.addColorStop(0.55, 'rgba(255,255,255,0.55)');
  sgrad.addColorStop(0.85, 'rgba(255,255,255,1)');
  sgrad.addColorStop(1, 'rgba(255,255,255,0)');
  sg.fillStyle = sgrad;
  sg.fillRect(0, 0, 1, 256);

  // Snowy peaks in three paper layers, light on their left faces.
  const p = s.peaks.getContext('2d');
  for (let i = 0; i < 3; i++) {
    const depth = i / 2;
    const base = horizon + h * 0.01 * i;
    const path = new Path2D();
    path.moveTo(0, base);
    let x = -w * 0.05;
    const tops = [];
    while (x < w * 1.05) {
      const span = w * (0.06 + rnd() * 0.08) * (1 + depth * 0.6);
      const height = h * (0.05 + Math.pow(rnd(), 1.5) * 0.24) * (1 - depth * 0.45);
      tops.push([x + span / 2, base - height, span]);
      path.lineTo(x + span / 2, base - height);
      path.lineTo(x + span, base - height * (0.2 + rnd() * 0.3));
      x += span;
    }
    path.lineTo(w, base);
    path.closePath();
    const rock = mix([0.12, 0.2, 0.3], [0.03, 0.06, 0.1], depth);
    p.shadowColor = 'rgba(0,0,0,0.5)';
    p.shadowBlur = h * 0.02;
    p.fillStyle = css(rock);
    p.fill(path);
    p.shadowColor = 'transparent';
    for (const [tx, ty, span] of depth < 1 ? tops : []) {
      p.fillStyle = css(mix([0.85, 0.93, 1], rock, depth * 0.55), 0.9);
      p.beginPath();
      p.moveTo(tx, ty);
      p.lineTo(tx - span * 0.22, ty + (base - ty) * 0.42);
      p.lineTo(tx - span * 0.05, ty + (base - ty) * 0.34);
      p.lineTo(tx + span * 0.08, ty + (base - ty) * 0.45);
      p.lineTo(tx + span * 0.16, ty + (base - ty) * 0.3);
      p.closePath();
      p.fill();
    }
  }
  scene = s;
}

function tintStrip() {
  // The strip sprite is white; colour each curtain with a tinted copy.
  for (const c of scene.curtains) {
    const t = layer(1, 256);
    const g = t.getContext('2d');
    g.drawImage(scene.strip, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = css(c.colour);
    g.fillRect(0, 0, 1, 256);
    c.sprite = t;
  }
}

function draw(t) {
  const s = scene;
  const { w, h, horizon } = s;
  ctx.drawImage(s.sky, 0, 0);
  for (const st of s.stars) {
    ctx.fillStyle = `rgba(230,245,255,${0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin((TAU * st.k * t) / LOOP + st.p), 2)})`;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, TAU);
    ctx.fill();
  }
  for (const c of s.curtains) curtain(c, t, 1);

  // The lake: a squashed mirror image of the sky and peaks, then ripples.
  const lake = ctx.createLinearGradient(0, horizon, 0, h);
  lake.addColorStop(0, '#05141f');
  lake.addColorStop(1, '#010509');
  ctx.fillStyle = lake;
  ctx.fillRect(0, horizon, w, h - horizon);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, horizon, w, h - horizon);
  ctx.clip();
  ctx.translate(0, horizon);
  ctx.scale(1, -0.55);
  ctx.translate(0, -horizon);
  for (const c of s.curtains) curtain(c, t, 0.35);
  ctx.globalAlpha = 0.45;
  ctx.drawImage(s.peaks, 0, 0);
  ctx.restore();
  ctx.drawImage(s.peaks, 0, 0);
  ctx.fillStyle = 'rgba(180,220,255,0.07)';
  for (let i = 0; i < 16; i++) {
    const y = horizon + h * 0.02 + i * h * 0.019;
    const x = ((i * 0.37 + (t / LOOP) * (i % 2 ? 1 : -1)) % 1 + 1) % 1;
    ctx.fillRect(x * w - w * 0.1, y, w * (0.08 + (i % 3) * 0.05), Math.max(1, h * 0.002));
  }
}

function curtain(c, t, strength) {
  const s = scene;
  const { w, h } = s;
  const step = Math.max(2, Math.round(w / 480));
  ctx.globalCompositeOperation = 'lighter';
  for (let x = 0; x < w; x += step) {
    const u = x / w;
    let y = 0;
    let bright = 0;
    for (const v of c.waves) {
      y += v.a * Math.sin(TAU * u * v.k + v.p + (TAU * v.m * t) / LOOP);
      bright += Math.sin(TAU * u * v.k * 1.7 - v.p + (TAU * v.m * 2 * t) / LOOP);
    }
    const a = c.alpha * (0.55 + 0.45 * (bright / 3) + level * 0.5) * strength;
    if (a <= 0) continue;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(c.sprite, x, c.base + y * h * 0.06 - c.height, step, c.height);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

let last = null;
let time = 0;
function frame(now) {
  if (last !== null) time += Math.min(0.1, (now - last) / 1000) * settings.speed;
  last = now;
  level *= 0.95;
  draw(time);
  requestAnimationFrame(frame);
}

const colour = (v) => v.split(' ').map(Number);
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    if (p.schemecolor) settings.tint = colour(p.schemecolor.value);
    if (p.second) settings.second = colour(p.second.value);
    if (p.speed) settings.speed = p.speed.value;
    if (p.schemecolor || p.second) { build(); tintStrip(); }
    if (still !== null) draw(still);
  },
};
if (window.wallpaperRegisterAudioListener) {
  window.wallpaperRegisterAudioListener((a) => {
    let sum = 0;
    for (let i = 0; i < 128; i++) sum += a[i] || 0;
    level = Math.max(level, Math.min(1, (sum / 128) * 3));
  });
}
addEventListener('resize', () => { build(); tintStrip(); if (still !== null) draw(still); });

build();
tintStrip();
if (still !== null) draw(still);
else requestAnimationFrame(frame);
</script>
</body>
</html>
