[package]
name = "lumen-ui"
description = "Lumen's desktop UI: library, monitors, playlists and settings, over lumend's IPC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lumen-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-ipc.workspace = true
lumen-library.workspace = true
lumen-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }

[lints]
workspace = true
