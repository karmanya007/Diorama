[package]
name = "lumen-ui"
description = "Lumen's desktop UI: library, monitors, playlists and settings, over lumend's IPC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lumen-ui"
path = "src/main.rs"

[features]
# Serve the built front end from the binary. Without it Tauri loads the Vite
# dev server (`npm run dev`); `cargo build` alone must give a working app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-ipc.workspace = true
lumen-library.workspace = true
lumen-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Windows updates are the signed NSIS installer itself, so no archive
# support (`zip`: v1-style zipped updates; tar for Linux/macOS, Phases 7/8).
# TLS from the OS (SChannel and its certificate store).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

[lints]
workspace = true
