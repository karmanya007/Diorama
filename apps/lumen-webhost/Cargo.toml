[package]
name = "lumen-webhost"
description = "Hosts one web wallpaper (WebView2 on Windows) behind the desktop icons for lumend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
lumen-platform.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wry.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com_StructuredStorage"] }

[lints]
workspace = true
