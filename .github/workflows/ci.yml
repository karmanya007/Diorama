name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target; Linux runs the same tests from day 1 so
        # Windows-only assumptions cannot leak outside diorama-platform.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned, hash-checked DXC for the shader runtime and scene golden tests
      # (they skip themselves when DXC or a GPU adapter is missing).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-dxc.ps1
          "DIORAMA_DXC=$PWD\.tools\dxc\dxc.exe" >> $env:GITHUB_ENV
      # The Linux release is a 515 MB archive: kept between runs.
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .tools/dxc
          key: dxc-linux-${{ hashFiles('scripts/fetch-dxc.sh') }}
      - if: runner.os == 'Linux'
        run: |
          bash scripts/fetch-dxc.sh
          echo "DIORAMA_DXC=$PWD/.tools/dxc/bin/dxc" >> "$GITHUB_ENV"
      # diorama-ui (Tauri) builds against WebKitGTK on Linux; media uses the
      # system's GStreamer and (as cpal's fallback) ALSA; lavapipe gives the
      # scene goldens a Vulkan adapter.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libgtk-layer-shell-dev mesa-vulkan-drivers
      - run: cargo test --workspace

  build-macos:
    # Build-only until the macOS port (Phase 8).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  layers:
    # Architecture rules (ADR-002): layer dependencies and OS code confined to diorama-platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-layers.sh

  fuzz:
    # Short smoke run per target on every push; longer runs can be scheduled later.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pkg, tex]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
