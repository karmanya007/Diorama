name: Release

# Pushing a `v*` tag (matching the workspace version, e.g. v0.1.0) builds the
# Windows installer and the Linux packages (.deb, AppImage) and publishes a
# GitHub Release with them, the signed update files and `latest.json`, which
# the in-app updater reads (Windows installer; Linux AppImage). Unsigned for
# now (no code-signing certificate): Windows SmartScreen warns on first run.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (the updater key; its public half is in apps/diorama-ui/src-tauri/tauri.conf.json).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/diorama-ui/package-lock.json

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'diorama-ui' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match version $version (Cargo.toml)"
          }

      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is not set' }
          ./scripts/bundle.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*-setup.exe*

  linux:
    # Same Ubuntu as the CI tests (and as old as practical: the .deb and
    # AppImage run on distributions with this glibc or newer).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/diorama-ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .tools/dxc
          key: dxc-linux-${{ hashFiles('scripts/fetch-dxc.sh') }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libgtk-layer-shell-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo 'TAURI_SIGNING_PRIVATE_KEY secret is not set'; exit 1; }
          bash scripts/bundle.sh

      # GNOME's extension, for AppImage users (the .deb installs it):
      # `gnome-extensions install <zip>`.
      - name: Pack the GNOME Shell extension
        run: |
          cd gnome/diorama@karmanya007.github.io
          zip ../../target/release/bundle/diorama@karmanya007.github.io.shell-extension.zip metadata.json extension.js

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/appimage/Diorama_AppImage_sources.txt
            target/release/bundle/*.shell-extension.zip

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write latest.json
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          dist = pathlib.Path("dist")
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          # Artifacts keep their folders (deb/, appimage/…): search them all.
          def entry(pattern):
              file = next(dist.rglob(pattern))
              sig = file.with_name(file.name + ".sig").read_text().strip()
              return {"signature": sig, "url": f"{base}/{file.name}"}
          latest = {
              "version": tag.removeprefix("v"),
              "notes": f"See https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              # Only AppImage installs update in place on Linux; the .deb
              # updates through the system's package tools.
              "platforms": {
                  "windows-x86_64": entry("*-setup.exe"),
                  "linux-x86_64-appimage": entry("*.AppImage"),
              },
          }
          (dist / "latest.json").write_text(json.dumps(latest, indent=2))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --title "Diorama $GITHUB_REF_NAME" --generate-notes
