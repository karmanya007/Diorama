# cargo-deny: license + advisory + source policy.
# Project is MIT OR Apache-2.0, so copyleft dependencies (GPL/AGPL) are not allowed.

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error (unmaintained, no known vulnerability): a build-time
    # macro crate reached only through Tauri's Linux GTK 3 stack
    # (glib-macros 0.18). Revisit when Tauri moves to GTK 4.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro via tauri's Linux GTK stack" },
    # zbus 5 split crates (unmaintained since merged into zbus 6, no known
    # vulnerability): Linux D-Bus of tauri-plugin-single-instance. Revisit
    # when the plugin moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via tauri-plugin-single-instance on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via tauri-plugin-single-instance on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via tauri-plugin-single-instance on Linux" },
]

[licenses]
allow = [
    # Public-domain equivalent (no conditions); used by interprocess's helper crates.
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow-list is policy for future deps, not an inventory of current ones.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps carry explicit versions in [workspace.dependencies]; this is a
# fallback in case a new internal crate is added without one.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
