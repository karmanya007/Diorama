[workspace]
resolver = "3"
members = [
    "apps/lumen-cli",
    "apps/lumend",
    "apps/lumen-webhost",
    "crates/lumen-core",
    "crates/lumen-gpu",
    "crates/lumen-ipc",
    "crates/lumen-library",
    "crates/lumen-media",
    "crates/lumen-particles",
    "crates/lumen-platform",
    "crates/lumen-render",
    "crates/lumen-scene",
    "crates/lumen-script",
    "crates/lumen-text",
    "crates/lumen-we",
    "tools/imgdiff",
    "tools/wpdump",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/karmanya007/Lumen"
publish = false

[workspace.dependencies]
# internal
lumen-core = { path = "crates/lumen-core", version = "0.0.1" }
lumen-we = { path = "crates/lumen-we", version = "0.0.1" }
lumen-library = { path = "crates/lumen-library", version = "0.0.1" }
lumen-gpu = { path = "crates/lumen-gpu", version = "0.0.1" }
lumen-ipc = { path = "crates/lumen-ipc", version = "0.0.1" }
lumen-media = { path = "crates/lumen-media", version = "0.0.1" }
lumen-particles = { path = "crates/lumen-particles", version = "0.0.1" }
lumen-platform = { path = "crates/lumen-platform", version = "0.0.1" }
lumen-render = { path = "crates/lumen-render", version = "0.0.1" }
lumen-scene = { path = "crates/lumen-scene", version = "0.0.1" }
lumen-script = { path = "crates/lumen-script", version = "0.0.1" }
lumen-text = { path = "crates/lumen-text", version = "0.0.1" }

# external
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3"
# 2.4.5 is days old; stay on the previous release.
interprocess = "=2.4.4"
pollster = "1"
raw-window-handle = "0.6"
# Web wallpapers (WebView2 on Windows, WebKitGTK later on Linux).
wry = { version = "0.57", default-features = false }
rquickjs = { version = "0.14.0", features = ["loader"] }
harfrust = "0.14.0"
swash = "0.2.10"
wgpu = "30.0.1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp"] }
# wgsl-in works around naga 30.0.1 gating front::interpolator (used by glsl-in) on spv-in/wgsl-in only.
naga = { version = "30.0.1", features = ["glsl-in", "spv-in", "wgsl-in"] }
lz4_flex ={ version = "0.11", default-features = false, features = ["safe-decode", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
